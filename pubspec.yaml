name: disaster_sense
description: "Disaster prediction and early warning system for Pakistan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.1
  intl: ^0.19.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_local_notifications: ^20.1.0
  workmanager: ^0.9.0+3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  flutter_staggered_animations: ^1.1.1
  animate_do: ^5.1.0
  glassmorphism: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app_icon.png"
  android_adaptive_icon_background: "#ffffff"
  android_adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
